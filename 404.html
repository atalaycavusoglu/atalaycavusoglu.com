<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sayfa bulunamadı · Atalay Çavuşoğlu</title>
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#1a0b0e">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23ff3b4e'/%3E%3Ctext x='50%25' y='54%25' text-anchor='middle' dominant-baseline='middle' font-family='Arial,sans-serif' font-weight='700' font-size='34' fill='white'%3EA%3C/text%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #1a0b0e;
      --surface: rgba(255, 255, 255, 0.035);
      --text: #f4f4f5;
      --muted: #a1a1aa;
      --line: rgba(255, 255, 255, 0.08);
      --accent: #ff3b4e;
      --accent-2: #ff8a3d;
      --accent-3: #8b5cf6;
      --ease: cubic-bezier(.2, .8, .2, 1);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html { background: var(--bg); }
    body {
      min-height: 100vh; min-height: 100svh; display: grid; place-items: center; padding: 24px; overflow: hidden;
      color: var(--text); font: 400 16px/1.65 Inter, system-ui, sans-serif; -webkit-font-smoothing: antialiased;
      text-align: center;
    }
    html[lang="tr"] .en, html[lang="en"] .tr { display: none !important; }
    .bg { position: fixed; inset: 0; z-index: -1; pointer-events: none; }
    .blob { position: absolute; border-radius: 50%; filter: blur(90px); }
    .b1 { width: 480px; height: 480px; background: var(--accent); opacity: .4; top: -160px; left: -140px; animation: f1 18s ease-in-out infinite; }
    .b2 { width: 420px; height: 420px; background: var(--accent-3); opacity: .3; bottom: -160px; right: -140px; animation: f2 22s ease-in-out infinite; }
    @keyframes f1 { 50% { transform: translate(120px, 100px) scale(1.15); } }
    @keyframes f2 { 50% { transform: translate(-140px, -80px) scale(.9); } }

    .code {
      display: flex; justify-content: center; gap: .02em;
      font: 700 clamp(120px, 30vw, 240px)/.9 "Space Grotesk", sans-serif; letter-spacing: -0.04em;
      animation: rise .9s var(--ease) both;
    }
    .code span {
      display: inline-block; padding-bottom: .06em;
      background: linear-gradient(100deg, var(--accent), var(--accent-2), var(--accent-3), var(--accent));
      background-size: 300% 100%; -webkit-background-clip: text; background-clip: text; color: transparent;
      animation: shift 8s linear infinite, wobble 3.2s ease-in-out infinite;
    }
    .code span:nth-child(2) { animation-delay: -1.1s; }
    .code span:nth-child(3) { animation-delay: -2.2s; }
    @keyframes shift { to { background-position: 300% 0; } }
    @keyframes wobble { 50% { transform: translateY(-10px) rotate(-3deg); } }
    @keyframes rise { from { opacity: 0; transform: translateY(30px); filter: blur(10px); } }
    h1 { font: 700 clamp(26px, 4vw, 36px)/1.15 "Space Grotesk", sans-serif; letter-spacing: -0.03em; margin: 18px 0 10px; animation: rise .9s var(--ease) .1s both; }
    p { color: var(--muted); max-width: 440px; margin: 0 auto; animation: rise .9s var(--ease) .2s both; }
    .cta { display: flex; flex-wrap: wrap; justify-content: center; gap: 12px; margin-top: 30px; animation: rise .9s var(--ease) .3s both; }
    .btn {
      display: inline-flex; align-items: center; gap: 8px; padding: 13px 22px; border-radius: 999px;
      font-weight: 600; font-size: 14px; text-decoration: none; color: var(--text);
      border: 1px solid var(--line); background: var(--surface); transition: border-color .25s, background .25s, transform .25s var(--ease);
    }
    .btn:hover { border-color: rgba(255, 255, 255, .25); background: rgba(255, 255, 255, .07); transform: translateY(-2px); }
    .btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; box-shadow: 0 10px 40px -10px rgba(255, 59, 78, .7); }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
  </style>
  <script>window.va = window.va || function () { (window.vaq = window.vaq || []).push(arguments); };</script>
  <script defer src="/_vercel/insights/script.js"></script>
</head>
<body>
  <div class="bg" aria-hidden="true"><div class="blob b1"></div><div class="blob b2"></div></div>
  <main>
    <div class="code" aria-hidden="true"><span>4</span><span>0</span><span>4</span></div>
    <h1><span class="tr">Bu sayfa kayıp.</span><span class="en">This page got lost.</span></h1>
    <p>
      <span class="tr">Aradığın sayfa taşınmış ya da hiç var olmamış olabilir. Aşağıdan devam edebilirsin.</span>
      <span class="en">The page you're looking for may have moved or never existed. You can continue below.</span>
    </p>
    <div class="cta">
      <a class="btn primary" href="/"><span class="tr">Ana sayfaya dön</span><span class="en">Back to home</span> →</a>
      <a class="btn" href="/blog/">Blog</a>
      <a class="btn" href="/#roas"><span class="tr">ROAS hesaplayıcı</span><span class="en">ROAS calculator</span></a>
    </div>
  </main>
  <script>
    (function () {
      var lang = null;
      try { lang = localStorage.getItem("lang"); } catch (e) {}
      if (lang !== "tr" && lang !== "en") lang = (navigator.language || "tr").toLowerCase().indexOf("tr") === 0 ? "tr" : "en";
      document.documentElement.lang = lang;
      if (lang === "en") document.title = "Page not found · Atalay Çavuşoğlu";
    })();
  </script>
</body>
</html>
